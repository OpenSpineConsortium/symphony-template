# Publishes what .github/symphony/public.json lists to the public
# repositories it names, so the parts of this repository meant for everyone
# reach them with no person copying anything (tools/public_export.py says
# how a manifest reads). On each push to the default branch, and by hand,
# one leg per export: it stages the export from this checkout, running the
# export's build before any token exists, then mints a SymphonyBoard App
# token for the target alone (contents and pull requests) and has
# scripts/export-publish.sh open or update one pull request there, whose
# own checks and merge rules decide. An export runs only in the repository
# its "source" names, so a copy of this one never publishes into the
# original's repositories, and nothing runs where the App's key is not set.
name: Export

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch && vars.SDLC_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exports: ${{ steps.plan.outputs.exports }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        run: echo "exports=$(python3 tools/public_export.py plan)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.exports != '[]' && needs.plan.outputs.exports != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        export: ${{ fromJSON(needs.plan.outputs.exports) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Stage what the export publishes
        env:
          NAME: ${{ matrix.export.name }}
        run: python3 tools/public_export.py stage "$NAME" "$RUNNER_TEMP/stage"

      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.export.owner }}
          repositories: ${{ matrix.export.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request in the target
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          NAME: ${{ matrix.export.name }}
          TARGET: ${{ matrix.export.owner }}/${{ matrix.export.repo }}
        run: bash scripts/export-publish.sh
