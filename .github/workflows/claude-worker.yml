name: Worker

# The worker routine (docs/agents/routines/worker.md), run from Actions
# instead of a claude.ai Project: on its schedule, carry the account's own
# open claim forward, else take one unclaimed issue from the queue to a
# draft pull request, under the same CLAUDE.md, rules and protocol as
# every other session. Off until a person sets the repository variable
# CLAUDE_WORKER to true (Settings, Secrets and variables, Actions,
# Variables), so nothing spends minutes or plan limits unasked; it also
# needs the secret CLAUDE_CODE_OAUTH_TOKEN (docs/setup/claude-action.md),
# whose runs draw on the main account's subscription and bill no API.
# A first cheap step asks GitHub whether there is anything to do, on
# GITHUB_TOKEN alone, and the Claude session only starts when there is:
# an empty queue costs seconds of a runner and no tokens. One run at a
# time; a run left behind is not cancelled, it is the one doing the work.

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  worker:
    if: vars.CLAUDE_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Ask GitHub whether there is anything to do
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          todo=$(gh issue list --repo "$REPO" --label todo --state open --json number --jq length)
          claims=$(gh pr list --repo "$REPO" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | test("^claude/[0-9]+$"))] | length')
          if [ "$todo" != "0" ] || [ "$claims" != "0" ]; then
            echo "work=true" >> "$GITHUB_OUTPUT"
            echo "$todo issue(s) in the queue, $claims open claim pull request(s)"
          else
            echo "work=false" >> "$GITHUB_OUTPUT"
            echo "the queue is empty and no claim pull request is open; no session runs"
          fi
      - name: Point at the setup when the token is not there
        if: steps.queue.outputs.work == 'true' && env.HAVE_TOKEN != 'true'
        run: echo "The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set; docs/setup/claude-action.md says how. Doing nothing."
      - uses: actions/checkout@v7
        if: steps.queue.outputs.work == 'true' && env.HAVE_TOKEN == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.queue.outputs.work == 'true' && env.HAVE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80
          prompt: |
            You are the worker on this repository, the account labelled account:main, running on a schedule. First read the board: git fetch origin board && git show origin/board:STATE.md; before the first board run that branch does not exist, and then you read the open issues and pull requests directly. Then follow CLAUDE.md and docs/agents/PROTOCOL.md, one issue this run, nothing else.

            1. If a claim of yours is open (a branch claude/<issue> whose issue carries account:main and is still open), carry it on instead of taking new work: read its pull request, checks and comments, fix what the check names, answer the comments, rebase on the default branch when the board said "main moved" (your own claim branch is the one place git push --force-with-lease is allowed), and finish as PROTOCOL.md's Finish section says. Then stop.
            2. Otherwise take one issue: an unclaimed blocker first, else the lowest-numbered issue the Queue shows unclaimed. None free: say so in one line and stop. Too unclear to act on: ask on the issue, leave it unclaimed, stop.
            3. Claim it as the protocol says: branch claude/<issue> from the default branch, the claim file docs/agents/claims/<issue>.md as the first and only commit, pushed; the labels claimed and account:main, the plan as a comment; a draft pull request at once with "Closes #<issue>".
            4. Work in small commits with bash scripts/check.sh passing before every push; a fact worth keeping goes to docs/memory/ in the same pull request.
            5. Done means: claim file deleted, "Closes #<issue>" in the body, checks green, the pull request marked ready and labelled in-review, one line saying what it does. Do not merge.

            Never push to another account's branch, never to the default branch; never force-push anything but your own claim after a rebase; never close an issue that is not done; never write a credential anywhere. Plain prose, no emoji. Nothing to do: say so in one line.
