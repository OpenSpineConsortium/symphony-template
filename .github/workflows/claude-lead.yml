name: Lead

# The lead of team mode, the chief of staff (docs/agents/TEAM.md). When
# an issue is labelled epic, Claude reads it and the code and returns a
# plan as JSON: who owns which files, and the interfaces between them;
# tools/team.py then writes the plan into the epic, opens one task per
# member named in the repository variable CLAUDE_TEAM, labelled todo and
# agent:<member>, and starts the members (claude-worker.yml). When a
# member labels its task blocked, Claude runs to settle what it needs and
# starts it again. When the last task of an epic closes, Claude runs once
# more to integrate: it checks the default branch as a whole and fixes
# what the pieces broke together. Everything that needs no judgement runs
# without Claude: the route job asks tools/team.py what an event calls
# for, so a closed issue outside any epic costs a few seconds of a runner
# and no usage. Off until both CLAUDE_TEAM is set and CLAUDE_WORKER is
# true, since a plan nobody works is usage wasted; Claude runs need the
# secret CLAUDE_CODE_OAUTH_TOKEN (docs/setup/claude-action.md) and draw on
# the main account's subscription. In crowd mode (docs/project.md,
# docs/setup/crowdsourcing.md) the route job never starts, and so neither
# does any job after it: plan, unblock and integrate need route and ask for
# no status function, so GitHub skips them with it.
#
# Runs for one epic or task wait for each other; runs for different ones
# do not. The group is set on the jobs that run Claude, not on the
# workflow: every label event in the repository starts this workflow, and
# GitHub keeps only one pending run per group, so a workflow-wide group
# would let any later label event cancel a plan or an integration that
# was waiting its turn. Each such job asks route again once its turn comes,
# so a duplicate that waited behind the first finds nothing left to do.
# Members' runs are started by GITHUB_TOKEN and integrations by a merge
# the Claude app turned on, so the action is told to accept those two bots.

on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: "The epic's issue number"
        required: true
      event:
        description: "labeled to plan it, closed to integrate it"
        required: true
        default: labeled

env:
  EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.event || github.event.action }}
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  LABEL: ${{ github.event_name == 'workflow_dispatch' && 'epic' || github.event.label.name }}

jobs:
  route:
    if: >-
      vars.CLAUDE_CROWD != 'true' && vars.CLAUDE_TEAM != '' && vars.CLAUDE_WORKER == 'true'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.action == 'labeled' && github.event.label.name == 'epic')
          || (github.event.action == 'labeled' && github.event.label.name == 'blocked'
              && contains(github.event.issue.body, 'Epic: #'))
          || (github.event.action == 'closed' && contains(github.event.issue.body, 'Epic: #')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      number: ${{ steps.route.outputs.number }}
    steps:
      - uses: actions/checkout@v7
      - name: Ask what this event calls for
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          answer=$(python3 tools/team.py route --event "$EVENT" --issue "$ISSUE" --label "$LABEL")
          echo "$answer"
          echo "phase=${answer%% *}" >> "$GITHUB_OUTPUT"
          echo "number=${answer##* }" >> "$GITHUB_OUTPUT"

  plan:
    needs: route
    if: needs.route.outputs.phase == 'plan'
    concurrency:
      group: lead-${{ needs.route.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
      id-token: write
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      EPIC: ${{ needs.route.outputs.number }}
    steps:
      - name: Point at the setup when the token is not there
        if: env.HAVE_TOKEN != 'true'
        run: echo "The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set; docs/setup/claude-action.md says how. Doing nothing."
      - uses: actions/checkout@v7
        if: env.HAVE_TOKEN == 'true'
      - name: Ask again now that this run's turn has come
        id: due
        if: env.HAVE_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          answer=$(python3 tools/team.py route --event "$EVENT" --issue "$ISSUE" --label "$LABEL")
          echo "$answer"
          echo "phase=${answer%% *}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: lead
        if: steps.due.outputs.phase == 'plan'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"plan":{"type":"string"},"tasks":{"type":"array","minItems":1,"items":{"type":"object","properties":{"title":{"type":"string"},"owner":{"type":"string","enum":${{ vars.CLAUDE_TEAM }}},"files":{"type":"array","items":{"type":"string"}},"body":{"type":"string"}},"required":["title","owner","files","body"]}}},"required":["plan","tasks"]}'
          prompt: |
            You are the team lead, the chief of staff, for epic #${{ env.EPIC }} on this repository. The members are ${{ vars.CLAUDE_TEAM }}. Read the epic and what has been said on it (gh issue view ${{ env.EPIC }} --comments), CLAUDE.md, docs/agents/TEAM.md, and the code the epic touches.

            Plan to avoid collisions. Divide the epic into at most one task per member, fewer when the epic is small; give each task a disjoint set of files to own; where two tasks meet, write the interface between them (names, signatures, data shapes) into both tasks, so each member can build against it before the other lands. Each task's body says what to build, the interface it provides and the one it uses, and how to know it is done: the tests that must pass. Owners are member names from the list above.

            Do not change any file and do not open any issue: return the plan as the JSON your output schema asks for, and a script opens the tasks. Its plan field is one or two paragraphs the members read first: who owns what, why, and in what order the pieces land. Plain prose, no emoji.
      - name: Open the tasks and start the members
        if: steps.lead.outputs.structured_output != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_TEAM: ${{ vars.CLAUDE_TEAM }}
          PLAN: ${{ steps.lead.outputs.structured_output }}
        run: |
          set -eu
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 tools/team.py seed --epic "$EPIC" --plan "$RUNNER_TEMP/plan.json"
          gh workflow run claude-worker.yml --repo "$GITHUB_REPOSITORY"

  unblock:
    needs: route
    if: needs.route.outputs.phase == 'unblock'
    concurrency:
      group: lead-${{ needs.route.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
      id-token: write
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      TASK: ${{ needs.route.outputs.number }}
    steps:
      - name: Point at the setup when the token is not there
        if: env.HAVE_TOKEN != 'true'
        run: echo "The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set; docs/setup/claude-action.md says how. Doing nothing."
      - uses: actions/checkout@v7
        if: env.HAVE_TOKEN == 'true'
        with:
          fetch-depth: 0
      - name: Ask again now that this run's turn has come
        id: due
        if: env.HAVE_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          answer=$(python3 tools/team.py route --event "$EVENT" --issue "$ISSUE" --label "$LABEL")
          echo "$answer"
          echo "phase=${answer%% *}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: lead
        if: steps.due.outputs.phase == 'unblock'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(git fetch:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*)"
          prompt: |
            You are the team lead, the chief of staff, on this repository, and the member who holds task #${{ env.TASK }} has labelled it blocked: it needs something only you or a peer can settle. Read the task and what has been said on it (gh issue view ${{ env.TASK }} --comments), then its epic, named on the task's "Epic: #N" line, with its plan and comments (gh issue view N --comments), CLAUDE.md and docs/agents/TEAM.md. Look at the code and at the members' branches where they bear on it (git fetch origin, then the claude/ branches of the epic's tasks).

            Settle it, as the lead of the plan you wrote. If an interface between two tasks is unclear or must change, decide it and write the decision on the epic, naming both tasks; if a peer must do something first, say so on the epic and on the peer's task; if the task cannot be done as planned, say what changes, and move it to another member by swapping its agent: label when that is better. Then remove the label blocked from #${{ env.TASK }} (gh issue edit ${{ env.TASK }} --remove-label blocked), and a script starts its owner again. If only the repository's owner can settle it (a product decision outside the epic, a setting or a secret), say exactly what is needed on the epic and leave the label on. Do not change any file. Plain prose, no emoji.
      - name: Start the task's owner again
        if: steps.lead.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          labels=$(gh issue view "$TASK" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx blocked; then
            echo "#$TASK is still blocked; it waits for the owner of the repository"
            exit 0
          fi
          owner=$(printf '%s\n' "$labels" | sed -n 's/^agent://p' | head -n 1)
          if [ -z "$owner" ]; then
            echo "#$TASK has no agent: label; the next schedule finds it"
            exit 0
          fi
          gh workflow run claude-worker.yml --repo "$GITHUB_REPOSITORY" -f agent="$owner"
          echo "$owner started again for #$TASK"

  integrate:
    needs: route
    if: needs.route.outputs.phase == 'integrate'
    concurrency:
      group: lead-${{ needs.route.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      EPIC: ${{ needs.route.outputs.number }}
    steps:
      - name: Point at the setup when the token is not there
        if: env.HAVE_TOKEN != 'true'
        run: echo "The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set; docs/setup/claude-action.md says how. Doing nothing."
      - uses: actions/checkout@v7
        if: env.HAVE_TOKEN == 'true'
        with:
          fetch-depth: 0
      - name: Ask again now that this run's turn has come
        id: due
        if: env.HAVE_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          answer=$(python3 tools/team.py route --event "$EVENT" --issue "$ISSUE" --label "$LABEL")
          echo "$answer"
          echo "phase=${answer%% *}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: steps.due.outputs.phase == 'integrate'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"
          claude_args: |
            --max-turns 60
            --allowedTools "${{ vars.CLAUDE_ALLOWED_TOOLS || 'Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(bash scripts/check.sh),Bash(python3:*)' }}"
          prompt: |
            You are the team lead, the chief of staff, and every task of epic #${{ env.EPIC }} is closed. Integration is the whole point of your job now: every task can pass alone while the whole fails. Read the epic, its plan and what has been said on it (gh issue view ${{ env.EPIC }} --comments), CLAUDE.md and docs/agents/TEAM.md.

            On the default branch, freshly fetched, run bash scripts/check.sh and every test the epic and its tasks name. If everything passes and the epic's spec is met, comment a short summary on the epic (what landed, in which pull requests) and close it. If anything fails, fix it under the claim protocol (docs/agents/PROTOCOL.md) on the branch claude/${{ env.EPIC }}: if that branch is already on origin, an earlier integration of yours left it, so check it out and carry on from its pull request; otherwise claim it, with a draft pull request saying "Closes #${{ env.EPIC }}". Make the fix with the checks passing, merge the default branch in if it has moved (never rebase, never force-push), then delete the claim file, mark the pull request ready and turn on auto-merge with gh pr merge --auto --merge; the epic closes when it lands. Never push to the default branch or to another member's branch. Plain prose, no emoji.
