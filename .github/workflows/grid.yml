# A job on the lab's cluster. The runner that Beethoven's hpcworker serves as a Slurm job
# (OpenSpineConsortium/hpcworker, tools/grid_runner.sh --start --repo <this repository>) takes a job
# that names its labels, so the command below runs on a compute node, in a checkout of the ref, inside
# the runner's own container (no home, no lab volume, the node's own temp), and GitHub keeps the log
# and the artifact as for any job; no Actions minutes are spent. Run from the workflow's page with a
# command, or called by another workflow with one. No secret reaches the grid: the job holds GitHub's
# token for the checkout alone and does not keep it, and nothing of Claude's is anywhere near a
# runner. Only a private or internal repository has a runner (the chain refuses a public one), and a
# fork's event never runs here. The job must end within the chain's margin (--margin at --start, 60
# minutes unless set), or the wall time cuts it off and GitHub reports the runner lost, so
# timeout-minutes stays under it. docs/setup/grid.md says how the chain is started and what the
# container carries.
name: Grid
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run on the grid, in a checkout of this ref, as bash reads it"
        required: true
        default: "bash scripts/check.sh"
      python:
        description: "Set Python 3.12 up first (the runner's container carries none)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      command:
        type: string
        required: true
      python:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  grid:
    # never a public repository, whose forks could run their pull requests on the grid, and never a fork's event
    if: github.event.repository.private == true && github.event.repository.fork == false
    runs-on: [self-hosted, grid]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.python
        with:
          python-version: "3.12"
      - name: run the command on the compute node
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          { printf '%s on %s as %s, in %s\n' "$(date -u +%FT%TZ)" "$(hostname -s)" "$(id -un)" "$(pwd)"; head -2 /etc/os-release; } | tee grid.log
          bash -c "$COMMAND" 2>&1 | tee -a grid.log
      - name: keep the log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ github.run_id }}-${{ github.run_attempt }}
          path: grid.log
          retention-days: 14
