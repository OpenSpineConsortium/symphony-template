# Brings back what contributors change in a public repository, for the
# exports .github/symphony/public.json marks "import": true, so a crowd
# working in the public copy improves this repository too
# (tools/public_export.py). Weekly and by hand, one leg per such export: it
# reads the target with a SymphonyBoard App token limited to reading it,
# copies the target's versions of the export's listed files back here, and
# where any differ opens or updates one pull request from
# symphony/import/<name>, pushed with a second App token for this
# repository alone, so this repository's own checks run on it and decide.
# Only the files the export lists can come back: a build's generated output
# and every path outside the manifest never do.
name: Import

on:
  schedule:
    - cron: "11 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  plan:
    if: vars.SDLC_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exports: ${{ steps.plan.outputs.exports }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        run: echo "exports=$(python3 tools/public_export.py plan | python3 -c 'import json, sys; print(json.dumps([e for e in json.load(sys.stdin) if e["import"]]))')" >> "$GITHUB_OUTPUT"

  take-back:
    needs: plan
    if: needs.plan.outputs.exports != '[]' && needs.plan.outputs.exports != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        export: ${{ fromJSON(needs.plan.outputs.exports) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: read
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.export.owner }}
          repositories: ${{ matrix.export.repo }}
          permission-contents: read

      # a scheduled run's event carries no repository, so the name comes
      # from GITHUB_REPOSITORY; an empty one would mint a token for every
      # repository the installation reaches
      - id: here
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: write
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.here.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request here
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
          GH_TOKEN: ${{ steps.write.outputs.token }}
          APP_SLUG: ${{ steps.write.outputs.app-slug }}
          NAME: ${{ matrix.export.name }}
          TARGET: ${{ matrix.export.owner }}/${{ matrix.export.repo }}
        run: bash scripts/export-import.sh
