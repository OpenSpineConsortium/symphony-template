# The grid's Claude accounts from the control panel's Grid tab: see each account's use and when its
# windows reset, move the worker to another account, sign one in, read the usage again, turn auto mode
# on or off. One action is one or a few words to the grid's ssh gate (OpenSpineConsortium/hpcworker,
# tools/grid_gate.sh, the accounts words of framework 21), over the key grid-gate.yml uses: the secret
# GRID_GATE_KEY and the variables GRID_ACCESS_ID and GRID_HOST_KEY of the environment grid. Only an admin
# of this repository may start it, since an account it signs in runs the owner's worker: the first step
# asks GitHub for the actor's permission and stops on anything less.
#
# What the panel reads is written to the branch grid: logs/<what>.json, a grid job's output cleaned of
# token shapes for the panel's Console (action log, hpcworker framework 23); accounts.json, the list with every e-mail masked
# (tools/grid_accounts.py), and, for a sign-in, link.json, Anthropic's sign-in link sealed for the
# browser that asked: an AES-256 key wrapped with the RSA-OAEP public key the panel sent as the input
# key, which only that page's own private key, never stored, opens. The link and the code are never in
# the log, the summary or the branch in the clear. The code from Anthropic's page is an input, so it is
# in the run's record for whoever may read this repository; it is worth nothing without the sign-in's
# own verifier, which never leaves the grid, and Anthropic takes it once. docs/setup/grid.md, "Several
# Claude accounts", has the owner's steps. The action job says one of the gate's job words (hpcworker
# #23): update, which brings the gate's own clone to hpcworker's main; artifacts, which keeps the
# artifacts/ folders of this repository and SchwingNet in the owner's ~/claude-artifacts on the grid
# (artifacts-grid.yml); the spine-datasets promoter's status, start, stop and restart (hpcworker #31);
# and SchwingNet's own grid/gate.sh words at its main (start, status, leaks,
# v1, latency, stop, fetch-<id>), so a session runs them in the owner's place (his choice of 2026-10-21); the answer is logs/job-<job>.json.
name: Grid accounts
run-name: "Grid accounts: ${{ inputs.action }} ${{ inputs.slot }}${{ inputs.job }} (${{ inputs.request }})"
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the grid's Claude accounts
        type: choice
        options: [list, use, login, code, usage, auto-on, auto-off, forget, worker-start, worker-stop, log, job]
        default: list
      slot:
        description: The account, 1 to 32 (use, login, code, forget, worker-start; log, for its sign-in's output)
        required: false
        default: ""
      code:
        description: The code from Anthropic's page (code)
        required: false
        default: ""
      name:
        description: The worker's name (worker-start, optional; worker-stop; log, for its output)
        required: false
        default: ""
      count:
        description: How many workers to start, 1 to 8 (worker-start); more than one are named NAME-1 to NAME-N
        required: false
        default: "1"
      key:
        description: The panel's RSA-OAEP public key, SPKI in base64, to seal the sign-in link for (login)
        required: false
        default: ""
      job:
        description: "The grid job (job): update, artifacts, promoter-status|start|stop|restart, schwingnet-start|status|leaks|v1|latency|stop|prior|chain_eval|samples, or schwingnet-fetch-<id> or schwingnet-census-<id>"
        required: false
        default: ""
      request:
        description: The panel's own name for this run, written back beside the answer
        required: false
        default: ""
permissions:
  contents: write
# A list may wait behind another and be dropped for a newer one, which reads the same; every other
# action runs at once in a group of its own, since GitHub keeps one waiting run per group and cancels
# the older, which lost presses (docs/research/grid-and-cloud-workers-review.md). The gate takes one
# call at a time and scripts/grid-accounts.sh tries again when it is busy.
concurrency:
  group: grid-accounts-${{ inputs.action == 'list' && 'list' || github.run_id }}
  cancel-in-progress: false
jobs:
  accounts:
    if: github.event.repository.private == true && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: grid
    steps:
      - name: only an admin of this repository
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          p=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null) || p=""
          [ "$p" = admin ] || { echo "::error::only an admin of $REPO may change the grid's Claude accounts ($ACTOR is ${p:-unknown})"; exit 1; }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: the action, through the grid's gate
        env:
          ACTION: ${{ inputs.action }}
          SLOT: ${{ inputs.slot }}
          NAME: ${{ inputs.name }}
          COUNT: ${{ inputs.count }}
          JOB: ${{ inputs.job }}
          CODE: ${{ inputs.code }}
          PANEL_KEY: ${{ inputs.key }}
          REQUEST: ${{ inputs.request }}
          KEY: ${{ secrets.GRID_GATE_KEY }}
          ACCESS_ID: ${{ vars.GRID_ACCESS_ID }}
          HOST_KEY: ${{ vars.GRID_HOST_KEY }}
          HOST: grid.wayne.edu
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/grid-accounts.sh
