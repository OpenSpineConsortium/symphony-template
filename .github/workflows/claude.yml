name: Claude

# Runs a Claude Code session when a person or a routine writes @claude on
# an issue, a pull request or a review: answer a question, take a fix, do
# what the comment asks, under the same CLAUDE.md and rules every other
# session reads. Authentication is the main account's subscription OAuth
# token in the repository secret CLAUDE_CODE_OAUTH_TOKEN, made with
# `claude setup-token` (docs/setup/claude-action.md): a run draws on that
# account's plan limits and bills no API. Until the secret is set, every
# run ends at the first step with a pointer and does nothing, so the
# template works without it. The turn cap keeps one runaway mention from
# spending the owner's five-hour window. Without --allowedTools the action
# grants only its own GitHub tools, so the session could not run git, gh or
# the checks; the repository variable CLAUDE_ALLOWED_TOOLS overrides the list.
# In crowd mode (docs/project.md, docs/setup/crowdsourcing.md) the job never
# starts: its condition needs the repository variable CLAUDE_CROWD not to be
# true, and a repository that never set it reads it as empty, so there the
# condition is exactly the one before it. After the session the job records
# what it spent, as workers.yml does, as an artifact the metrics workflow
# reads (docs/setup/metrics.md, What the work cost).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      vars.CLAUDE_CROWD != 'true' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Point at the setup when the token is not there
        if: env.HAVE_TOKEN != 'true'
        run: echo "The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set; docs/setup/claude-action.md says how. Doing nothing."
      - uses: actions/checkout@v7
        if: env.HAVE_TOKEN == 'true'
        with:
          fetch-depth: 0
      - name: Keep a copy of the usage recorder, which the run cannot move
        if: env.HAVE_TOKEN == 'true'
        run: |
          cp tools/usage.py "$RUNNER_TEMP/usage.py"
          cp -r tools/profile.py tools/economics.py tools/sdlc_protocol "$RUNNER_TEMP/" || true
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: env.HAVE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 50
            --allowedTools "${{ vars.CLAUDE_ALLOWED_TOOLS || 'Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(bash scripts/check.sh),Bash(python3:*)' }}"
      - name: Record what the run spent, for the field metrics
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SDLC_METRICS: ${{ vars.SDLC_METRICS }}
          ISSUE_NUMBER: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          PULL_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: >-
          python3 "$RUNNER_TEMP/usage.py" actions --root "$GITHUB_WORKSPACE"
          --execution-file "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          --out "$RUNNER_TEMP/symphony-usage/record.json" --workflow claude --job claude --issue "$ISSUE_NUMBER" --pull "$PULL_NUMBER"
      - name: Keep the record where the metrics workflow reads it
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: symphony-usage-${{ github.run_id }}-${{ github.run_attempt }}-claude
          path: ${{ runner.temp }}/symphony-usage/record.json
          if-no-files-found: ignore
