# The GitHub side of a copy, applied by the SymphonyBoard App with no step
# by hand (the owner, 2026-10-20: "I NEVER WANT TO NEED TO MANUALLY ... SET
# REPO SETTINGS AGAIN"). "Use this template" copies files and nothing else,
# and GITHUB_TOKEN can set none of the settings, so this job makes the App's
# installation token, which carries Administration, Variables and Pages
# where the installation accepted them, and runs scripts/setup-repo.sh with
# it: the ruleset of docs/setup/ruleset-main.json, with whatever checks this
# copy adds to that file, then the pin of its check "check" to GitHub
# Actions, delete-branch-on-merge and auto-merge, the topic symphony, secret
# scanning with push protection, "Allow GitHub Actions to create and approve
# pull requests", the environment token-store, GitHub Pages for docs.yml
# with the variable SYMPHONY_DOCS, and the labels. The script does nothing
# twice and reports each refusal and goes on, so running it again is safe.
#
# It runs on the push that template-init's App token makes, which deletes
# .template/ (a push made with GITHUB_TOKEN would start nothing, and then
# the App is not set up either), on a merge that changes the ruleset's file
# or this workflow, and by hand. Weekly and when the repository is made
# public it runs again to make only what a Free plan or a private
# repository held back, the environment and the Pages site, where they are
# missing; it never turns back on what the owner turned off on purpose. template-init's own
# placeholders keep it off in the template itself and in a copy not yet
# initialised. Where the variable SDLC_APP_ID and the secret
# SDLC_APP_PRIVATE_KEY are not set, or the App is not installed here, it
# says so and ends green. In crowd mode the script stops before any write,
# since crowd mode keeps auto-merge off (docs/setup/crowdsourcing.md), and
# where the App cannot read the variable that says so it leaves auto-merge
# alone (SYMPHONY_SETTINGS_APP). A run whose script stopped ends green with
# a warning, so a refusal never reads as a broken default branch.
#
# The ruleset is made once from the file and left as it is after, as the
# script leaves it, so a change to the file's checks is applied by the
# rule's own workflow where the copy has one, or by deleting the ruleset
# under Settings, Rules and running this again.
name: Settings

on:
  push:
    paths:
      - .template/**
      - docs/setup/ruleset-main.json
      - scripts/setup-repo.sh
      - .github/workflows/settings.yml
  # A private repository made public, and a weekly look, since GitHub sends
  # no event when a plan changes: these runs make only the environment and
  # the Pages site where they are missing (SYMPHONY_SETTINGS_RECHECK in
  # scripts/setup-repo.sh), never turning back on what the owner turned off.
  public:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Is this a copy that has been initialised?
        id: copy
        run: |
          if [ -f .template/PENDING ]; then
            echo "copy=false" >> "$GITHUB_OUTPUT"
            echo "the template itself, or a copy template-init has not filled yet; nothing to do"
          else
            echo "copy=true" >> "$GITHUB_OUTPUT"
          fi

      # The permissions the script uses, named, for this repository alone,
      # since beethoven-qa's supply-chain standard, which a copy carries,
      # refuses a token with the installation's whole set. Naming one the
      # installation has not accepted fails the whole mint, so a second mint
      # without Pages and Variables stands in until the owner accepts them.
      # The action reads every permission-* input it is given, declared or
      # not, from the environment GitHub sets for them, so the variable below
      # reaches GitHub as actions_variables, which lets the script set
      # SYMPHONY_DOCS; the action declares no such input, so it is given as
      # that environment variable rather than under with:. The action's own
      # post step revokes each token.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.copy.outputs.copy == 'true' && vars.SDLC_APP_ID != ''
        continue-on-error: true
        env:
          INPUT_PERMISSION-ACTIONS-VARIABLES: write
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-metadata: read
          permission-pages: write

      - uses: actions/create-github-app-token@v3
        id: app-token-core
        if: steps.copy.outputs.copy == 'true' && vars.SDLC_APP_ID != '' && steps.app-token.outputs.token == ''
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-metadata: read

      # The pin takes the check only once GitHub Actions has reported it on
      # the default branch; on the push that started the check too, wait
      # for its run to appear, five minutes at most, or run this workflow
      # again later to pin it.
      - name: Wait for the check on the default branch
        if: (steps.app-token.outputs.token || steps.app-token-core.outputs.token) != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.app-token-core.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 30); do
            reported=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=check" \
              --jq '[.check_runs[] | select(.app.id == 15368)] | length' 2>/dev/null) || reported=0
            if [ "$reported" != 0 ]; then
              echo "GitHub Actions has reported the check"
              exit 0
            fi
            sleep 10
          done
          echo "the check has not appeared yet; run this workflow again to pin it"

      - name: Apply the settings
        if: (steps.app-token.outputs.token || steps.app-token-core.outputs.token) != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.app-token-core.outputs.token }}
          SYMPHONY_SETTINGS_APP: "1"
          SYMPHONY_CROWD_VARIABLE: ${{ vars.CLAUDE_CROWD }}
          SYMPHONY_DOCS_VARIABLE: ${{ vars.SYMPHONY_DOCS }}
          SYMPHONY_SETTINGS_RECHECK: ${{ (github.event_name == 'schedule' || github.event_name == 'public') && '1' || '' }}
        run: |
          status=0
          bash scripts/setup-repo.sh "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/settings.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/settings.log"
          { echo '```'; cat "$RUNNER_TEMP/settings.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::warning::scripts/setup-repo.sh stopped (exit $status) before every setting was applied; its last line says why"
          fi

      # The template itself, and a copy template-init has not filled yet,
      # take no setting but one: "Require branches to be up to date" off in
      # their own rulesets, which the owner asked for on 2026-10-20, since
      # every merge otherwise sent each other ready pull request back to CI.
      - uses: actions/create-github-app-token@v3
        id: template-token
        if: steps.copy.outputs.copy == 'false' && vars.SDLC_APP_ID != ''
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-metadata: read

      - name: Turn the up-to-date rule off
        if: steps.template-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.template-token.outputs.token }}
        run: |
          set -euo pipefail
          for id in $(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=false&per_page=100" --jq '.[].id'); do
            gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" > "$RUNNER_TEMP/ruleset.json"
            if python3 tools/unstrict_ruleset.py "$RUNNER_TEMP/ruleset.json" "$RUNNER_TEMP/body.json"; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/rulesets/$id" --input "$RUNNER_TEMP/body.json" --silent
              echo "ruleset $id: up-to-date rule turned off" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "ruleset $id: up-to-date rule off already" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Say why nothing was applied
        if: steps.copy.outputs.copy == 'true' && (steps.app-token.outputs.token || steps.app-token-core.outputs.token) == ''
        run: |
          echo "::notice::the SymphonyBoard App's token could not be made here (the variable SDLC_APP_ID and the secret SDLC_APP_PRIVATE_KEY are not set, or the App is not installed on this repository), so no setting was applied; run scripts/setup-repo.sh from a clone, or install the App and run this workflow"
