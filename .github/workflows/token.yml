# One Claude account's subscription token for the control panel's Tokens
# page (Add a Claude account), minted on a runner in about a minute
# instead of in a Codespace, which took minutes to start. The page opens
# an issue, starts this workflow with the issue's number and the public
# key GitHub's secrets API gave it, and watches the issue: the run posts
# claude's sign-in link there, the person signs in and the page posts the
# code claude.ai shows back as the person, and the run posts the token
# sealed for that key, which the page stores as the slot's secret. The
# token is never on the page, in the issue or in the log
# (tools/token_run.py, docs/setup/claude-tokens.md). The run holds no
# secret and needs none: GITHUB_TOKEN only comments, and only someone who
# may write here can start it. For someone who may write here but is not
# an owner of the organization, whom GitHub lets write no organization
# secret, the page asks for store: pool, and the job store does the saving
# itself with the SymphonyBoard App's key, into a free slot of the
# organization's pool only, marked as theirs (the owner's choice of
# 2026-10-18). That job runs in the environment token-store, which an owner
# limits to the default branch, so only the default branch's script ever
# holds the App's token. In crowd mode it never runs, since the
# repository then holds no Claude token (docs/setup/crowdsourcing.md).
name: Token

on:
  workflow_dispatch:
    inputs:
      issue:
        description: the issue the Tokens page opened for this sign-in
        required: true
      key:
        description: the secrets public key, in base64, to seal the token for
        required: false
      key_id:
        description: that key's id
        required: false
      store:
        description: pool, for the run to store the token in the organization's pool itself
        required: false

permissions: {}

concurrency:
  group: token-${{ inputs.issue }}

jobs:
  mint:
    if: vars.CLAUDE_CROWD != 'true' && inputs.store != 'pool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code
      - name: Sign in and seal the token
        env:
          ISSUE: ${{ inputs.issue }}
          KEY: ${{ inputs.key }}
          KEY_ID: ${{ inputs.key_id }}
          ACTOR: ${{ github.triggering_actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/token_run.py

  store:
    if: vars.CLAUDE_CROWD != 'true' && inputs.store == 'pool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: token-store
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-secrets: write
          permission-organization-actions-variables: write
      - name: Install Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code
      - name: Sign in and store the token
        env:
          ISSUE: ${{ inputs.issue }}
          ACTOR: ${{ github.triggering_actor }}
          GITHUB_TOKEN: ${{ github.token }}
          STORE_ORG: ${{ github.repository_owner }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_ID: ${{ github.repository_id }}
        run: python3 tools/token_run.py
